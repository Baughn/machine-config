[package]
name = "nix-deploy"
version = "0.1.0"
edition = "2021"
description = "Build, diff, and deploy the machines in this flake with a single evaluation"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
toml = "0.8"
