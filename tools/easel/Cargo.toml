[package]
name = "easel"
version = "0.1.0"
edition = "2021"
description = "A raster painting tool for language models: a replayable DSL of marks, layers and views"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
rand = { version = "0.9.2", default-features = false, features = ["std"] }
rand_chacha = "0.9.0"
rayon = "1.11.0"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd", "png-format"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
